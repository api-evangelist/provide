name: Provide
description: 'Provide is a financial services division of Fifth Third Bank offering
  banking and financing built specifically for owners of professional practices —
  dental, medical, veterinary, optometry, childcare, financial advisory, funeral,
  and insurance businesses. The company provides conventional and SBA loans to start,
  acquire, or expand a practice, alongside a full suite of customized banking products.
  Provide was acquired by Fifth Third Bank and operates as a specialty lending and
  banking brand. Surfaced as a portfolio company of QED Investors; it publishes no
  public developer API, documentation, or developer portal at this time.'
